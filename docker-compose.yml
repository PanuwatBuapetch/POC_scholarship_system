services:
  # 1. Database Service
  postgres:
    image: postgres:17-alpine
    container_name: psu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: psu_scholarship
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psu_scholarship"]
      interval: 3s
      timeout: 5s
      retries: 5

  # 2. Backend Service (POC_scholaship_server)
  server:
    build: ./POC_scholaship_server
    container_name: psu_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/psu_scholarship?schema=public"
      PORT: 5000
      JWT_SECRET: "psu-scholarship-jwt-secret-key-2026"
    depends_on:
      postgres:
        condition: service_healthy
    # ไม่ต้องใส่ command: ซ้ำตรงนี้ ให้ Dockerfile จัดการเอง

  # 3. Frontend Service (POC_scholaship_system)
  client:
    build: ./POC_scholaship_system
    container_name: psu_frontend
    ports:
      - "3000:3000"
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server